<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCSVIT Cloud Services</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RCSVIT">
    <style>
      #pwa-banner {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1a2e;
        color: #fff;
        padding: 16px 20px;
        z-index: 9999;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 -2px 16px rgba(0,0,0,0.4);
        gap: 16px;
        font-family: inherit;
        border-top: 1px solid #2d2d4e;
      }
      #pwa-banner.visible { display: flex; }
      #pwa-banner .pwa-text strong { font-size: 15px; }
      #pwa-banner .pwa-text small { color: #aaa; font-size: 12px; }
      #pwa-banner .pwa-actions { display: flex; gap: 10px; flex-shrink: 0; }
      #pwa-install-btn {
        background: #4f8ef7;
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      #pwa-install-btn:hover { background: #3a7de0; }
      #pwa-dismiss-btn {
        background: transparent;
        color: #aaa;
        border: 1px solid #444;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
      }
      #pwa-dismiss-btn:hover { border-color: #888; color: #ccc; }
    </style>
</head>
<body>
    <header class="site-header">
        <span class="site-title">RCSVIT Cloud Services</span>
    </header>
    <main class="main-container">
        <section class="page-header">
            <h1 class="page-title">Explore by Year</h1>
            <p class="page-subtitle">Select a year to browse our club memories</p>
        </section>
        <div id="year-grid" class="gallery-grid">
            <p>Loading years…</p>
        </div>
    </main>

    <!-- PWA Install Banner -->
    <div id="pwa-banner" role="banner" aria-label="Install app prompt">
      <div class="pwa-text">
        <strong>Install RCSVIT Cloud</strong><br>
        <small>Add to your home screen for the full app experience</small>
      </div>
      <div class="pwa-actions">
        <button id="pwa-install-btn">Install</button>
        <button id="pwa-dismiss-btn">Not now</button>
      </div>
    </div>

    <script type="module" src="js/gallery.js"></script>

    <script>
      // ── GitHub Pages 404 redirect restore ───────────────────────────────
      // (404.html saves the path, we clean it up here)
      sessionStorage.removeItem('gh-redirect-path');

      // ── Service Worker registration ──────────────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/RCSVITCloud/sw.js', {
            scope: '/RCSVITCloud/'
          });
        });
      }

      // ── PWA Install prompt ───────────────────────────────────────────────
      (() => {
        const banner      = document.getElementById('pwa-banner');
        const installBtn  = document.getElementById('pwa-install-btn');
        const dismissBtn  = document.getElementById('pwa-dismiss-btn');
        let deferredPrompt = null;

        const isStandalone = () =>
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;

        const wasDismissed = () =>
          localStorage.getItem('pwa-install-dismissed') === '1';

        // Capture the browser's install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;

          // Only show if: not already installed, and user hasn't dismissed
          if (!isStandalone() && !wasDismissed()) {
            banner.classList.add('visible');
          }
        });

        // User clicks Install
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            banner.classList.remove('visible');
          }
          deferredPrompt = null;
        });

        // User dismisses — remember for this browser
        dismissBtn.addEventListener('click', () => {
          banner.classList.remove('visible');
          localStorage.setItem('pwa-install-dismissed', '1');
        });

        // Auto-hide once installed (e.g. from browser's own prompt)
        window.addEventListener('appinstalled', () => {
          banner.classList.remove('visible');
          deferredPrompt = null;
        });
      })();
    </script>
</body>
</html>
